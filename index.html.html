<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#819987">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Jess & Grace's Travel Planner</title>
<style>
:root{--sage:#819987;--sage2:#e8f0ea;--ink:#26352c;--muted:#68766e;--line:#d5dfd7;--cream:#faf9f5;--white:#fff;--pink:#d989a9}
*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
.app{max-width:760px;margin:auto;padding:18px 14px 40px}.surface{background:var(--cream);border:1px solid var(--line);border-radius:24px;padding:22px}
.muted,.sub,.small{font-family:Inter,system-ui,sans-serif;color:var(--muted)}.small{font-size:12px}
h1{font-size:36px;line-height:1.08;margin:8px 0}h2{font-size:28px;margin:8px 0}.script{font-family:"Brush Script MT","Segoe Script",cursive}
button{cursor:pointer}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:10px 13px;min-height:44px;font:14px Inter,system-ui,sans-serif}.primary{background:var(--sage);color:#fff;border-color:var(--sage)}.pink{background:var(--pink);color:#fff;border-color:var(--pink)}
.countbox{margin-top:22px;padding:20px;border-radius:18px;background:var(--sage2)}.count{font-size:40px;font-weight:700}
.menu{margin-top:22px;display:grid;gap:10px}.menu button{width:100%;display:flex;align-items:center;gap:15px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 17px;min-height:72px;color:var(--ink)}.icon{font:25px Inter,system-ui,sans-serif;width:34px;text-align:center}.menu-title{font-size:20px;font-weight:700}.arrow{margin-left:auto;font:24px Inter,system-ui,sans-serif}
.pagehead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.back{margin-bottom:14px}.action-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.route{border-left:3px solid var(--sage);padding:12px 0 12px 14px;margin-left:4px}.route-title{font-weight:700;font-size:17px}.tag{display:inline-block;background:var(--sage2);padding:4px 8px;border-radius:99px;font:11px Inter,system-ui,sans-serif;margin-top:5px}.card,.event-card,.edit-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:15px Inter,system-ui,sans-serif;min-height:44px}textarea{min-height:80px}form{display:grid;gap:9px}.hidden{display:none!important}.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font:14px Inter,system-ui,sans-serif}.check input{width:20px;min-height:20px}.done{text-decoration:line-through;opacity:.55}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.empty{text-align:center;padding:20px;color:var(--muted);font:14px Inter,system-ui,sans-serif}
.route-actions{display:flex;gap:5px;flex-shrink:0}.mini{min-height:38px;padding:7px 9px;font-size:13px}
.map-wrap{margin-top:14px;background:#fff;border:0;border-radius:20px;padding:4px;overflow:hidden}.map-wrap svg{display:block;width:100%;height:auto;min-height:560px}.map-land{fill:none;stroke:#222;stroke-width:.8;stroke-linejoin:round;stroke-linecap:round}.map-marker{cursor:pointer}.map-marker text{fill:#111;font:900 3.2px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle}.map-marker.active text{fill:var(--pink)}
.map-info{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.map-info h3{margin:0 0 5px;font-size:20px}.date{font:13px Inter,system-ui,sans-serif;color:var(--muted)}
.edit-card{background:var(--sage2)}.edit-title{font-size:20px;font-weight:700}.edit-label{font:12px Inter,system-ui,sans-serif;color:var(--muted);margin-bottom:4px;display:block}
@media(max-width:560px){h1{font-size:31px}.grid2{grid-template-columns:1fr}.pagehead{align-items:flex-start;flex-direction:column}.action-row{justify-content:flex-start}.map-wrap svg{min-height:470px}}
</style>
</head>
<body><div class="app" id="app"></div>
<script>
const KEY="jg-travel-v2";
const thaiBase=[
["Bangkok","2–5 Nov 2026","3 nights","Grand Palace, Wat Pho, Chinatown, markets, rooftop evening."],
["Sukhothai","5–7 Nov","2 nights","Ancient temples and historical park."],["Chiang Mai","7–13 Nov","6 nights","Old Town, Doi Suthep, markets, cooking class, elephant sanctuary."],["Pai","13–17 Nov","4 nights","Pai Canyon, hot springs, waterfalls and mountain days."],["Koh Tao","18–22 Nov","4 nights","Snorkelling/diving, viewpoints and beaches."],["Koh Phangan","22–27 Nov","5 nights","Arrive before the 24 Nov Full Moon Party; beaches and recovery days."],["Koh Samui","27–30 Nov","3 nights","Beach time, waterfalls and slower island days."],["Khao Sok","30 Nov–3 Dec","3 nights","Jungle, Cheow Lan Lake and floating accommodation option."],["Krabi","3–10 Dec","7 nights","Railay, Ao Nang, Hong Islands and island days."],["Phi Phi","10–14 Dec","4 nights","Viewpoints, beaches and boat/snorkelling day."],["Koh Lanta","14–19 Dec","5 nights","Slower island stop before Phuket."],["Khao Lak","19–22 Dec","3 nights","Relaxed beach stop and progression toward Phuket."],["Phuket","22 Dec–2 Jan","11 nights","Christmas, beaches, nightlife and New Year."]];

const vietBase=[
["Ho Chi Minh City","1–4 Jan 2027","3 nights","1 Jan is a rest day; explore from 2 Jan."],["Mekong Delta","4–6 Jan","2 nights","Ben Tre / Can Tho, canals and floating-market experience."],["Da Lat","6–8 Jan","2 nights","Highlands, waterfalls and cafés."],["Hoi An","8–11 Jan","3 nights","Old Town, food, tailoring and beach."],["Hue","11–13 Jan","2 nights","Imperial City and royal tombs."],["Phong Nha","13–15 Jan","2 nights","Caves and national park."],["Ninh Binh","15–18 Jan","3 nights","Trang An, Tam Coc and Mua Cave."],["Hanoi","18–21 Jan","3 nights","Old Quarter, food and northern prep."],["Ha Giang Loop","21–25 Jan","4 nights","MUST DO. Consider an Easy Rider if not experienced."],["Hanoi","25–31 Jan","6 nights","Buffer, laundry, shopping and flight home."]];

const base={budget:14000,spent:[],travel:[],checked:[],displayCurrency:"AUD",thRoute:structuredClone(thaiBase),vnRoute:structuredClone(vietBase),
thEvents:[{title:"Full Moon Party — Koh Phangan",date:"24 Nov 2026",location:"Koh Phangan",status:"MUST DO",note:"Current published date; route is built around it."},{title:"New Year Countdown — Phuket",date:"31 Dec 2026",location:"Phuket",status:"MUST DO",note:"Fixed around your Phuket stay."},{title:"Yi Peng / Lantern Festival — Chiang Mai",date:"24–25 Nov 2026",location:"Chiang Mai",status:"WISHLIST",note:"Potential route conflict; verify dates before changing the itinerary."}],
vnEvents:[{title:"Ha Giang Loop",date:"Late Jan 2027",location:"Ha Giang",status:"MUST DO",note:"Final major adventure; allow about 4 days and keep weather flexibility."},{title:"Hoi An Lantern Night",date:"TBC",location:"Hoi An",status:"WISHLIST",note:"Add the confirmed monthly date."},{title:"Ha Long Bay / Lan Ha Bay",date:"TBC",location:"Ha Long Bay",status:"WISHLIST",note:"Optional northern highlight."}]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(base);
if(!Array.isArray(data.thRoute))data.thRoute=structuredClone(thaiBase);if(!Array.isArray(data.vnRoute))data.vnRoute=structuredClone(vietBase);
if(!Array.isArray(data.thEvents))data.thEvents=[];if(!Array.isArray(data.vnEvents))data.vnEvents=[];if(!Array.isArray(data.spent))data.spent=[];if(!Array.isArray(data.travel))data.travel=[];if(!Array.isArray(data.checked))data.checked=[];
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
const places=[...new Set([...data.thRoute,...data.vnRoute].map(x=>x[0]).concat(["Koh Phangan","Koh Tao","Koh Samui","Phuket","Chiang Mai","Ha Long Bay","Lan Ha Bay","Suvarnabhumi Airport","Phuket International Airport","Tan Son Nhat International Airport","Noi Bai International Airport"]))];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const dl=id=>`<datalist id="${id}">${places.map(p=>`<option value="${esc(p)}">`).join("")}</datalist>`;
const menu=(i,t,s,p)=>`<button onclick="go('${p}')"><span class="icon">${i}</span><span><div class="menu-title">${t}</div><div class="muted small">${s}</div></span><span class="arrow">›</span></button>`;
function countdown(){return Math.max(0,Math.ceil((new Date("2026-11-02T00:00:00+10:00")-new Date())/86400000))}
function home(){return `<section class="surface"><div class="muted small">2 NOVEMBER 2026 — EARLY FEBRUARY 2027</div><h1>Jess & Grace's<br>Travel Planner</h1><div class="countbox"><div class="script" style="font-size:25px">Our adventure begins in...</div><div class="count">${countdown()} days</div><div class="muted small">until 2 November 2026 🇹🇭</div></div><div class="menu">${menu("🇹🇭","Thailand","Plan our route, destinations & things to do","thailand")}${menu("🇻🇳","Vietnam","Our route north & Ha Giang adventure","vietnam")}${menu("💰","Budget & Spending","Track our $14,000 AUD trip fund","budget")}${menu("🎒","Packing Checklist","Everything we need for 3 months","checklist")}${menu("✈️","Travel","Flights, buses, trains & ferries","travel")}</div></section>`}
function back(){return `<button class="btn back" onclick="go('home')">← Home</button>`}
function routePage(title,key,desc){const arr=key==="thai"?data.thRoute:data.vnRoute;return `${back()}<section class="surface"><div class="pagehead"><div><div class="script" style="font-size:32px">${title}</div><h2>${title==="Thailand"?"🇹🇭":"🇻🇳"} Route</h2></div><div class="action-row"><button class="btn primary" onclick="go('${key==="thai"?"thEvents":"vnEvents"}')">✨ Events</button><button class="btn pink" onclick="go('${key==="thai"?"thMap":"vnMap"}')">🗺️ Map</button></div></div><p class="sub">${desc}</p>${arr.map((p,i)=>`<div class="route"><div class="row"><div style="flex:1"><div class="route-title">${i+1}. ${esc(p[0])}</div><div class="sub small">${esc(p[1])} · ${esc(p[2])}</div><div class="sub" style="margin-top:5px">${esc(p[3])}</div></div><div class="route-actions"><button class="btn mini" onclick="editRoute('${key}',${i})">Edit</button><button class="btn mini" onclick="moveRoute('${key}',${i},-1)" ${i===0?"disabled":""}>↑</button><button class="btn mini" onclick="moveRoute('${key}',${i},1)" ${i===arr.length-1?"disabled":""}>↓</button></div></div></div>`).join("")}</section>`}
function eventPage(title,key){let a=data[key==="thEvents"?"thEvents":"vnEvents"];return `${back()}<section class="surface"><div class="pagehead"><div><div class="script" style="font-size:32px">${title}</div><h2>✨ Events & must-dos</h2></div></div><p class="sub">Keep a running list of things you want to do or see.</p>${a.map((e,i)=>`<div class="event-card"><div class="row"><div><div class="route-title">${esc(e.title)}</div><div class="small muted">${esc(e.date)} · ${esc(e.location)}</div>${e.note?`<div class="sub" style="margin-top:7px">${esc(e.note)}</div>`:""}</div><button class="btn" onclick="removeEvent('${key}',${i})">×</button></div><span class="tag">${esc(e.status||"WISHLIST")}</span></div>`).join("")}<div class="card"><h3>＋ Add an event</h3><form onsubmit="addEvent(event,'${key}')"><input name="title" placeholder="Event title" required><input name="date" placeholder="Date" required><input name="location" list="eventPlaces" placeholder="Where is it?" required autocomplete="off">${dl("eventPlaces")}<textarea name="note" placeholder="Optional notes"></textarea><button class="btn primary">＋ Add event</button></form></div></section>`}

const mapPos={thailand:{"Bangkok":[48,10],"Sukhothai":[43,19],"Chiang Mai":[38,14],"Pai":[35,10],"Koh Tao":[57,55],"Koh Phangan":[61,60],"Koh Samui":[64,59],"Khao Sok":[52,55],"Krabi":[48,66],"Phi Phi":[44,72],"Koh Lanta":[42,78],"Khao Lak":[45,57],"Phuket":[43,70]},vietnam:{"Ho Chi Minh City":[49,86],"Mekong Delta":[45,94],"Da Lat":[51,76],"Hoi An":[60,58],"Hue":[59,48],"Phong Nha":[56,38],"Ninh Binh":[55,20],"Hanoi":[53,12],"Ha Giang Loop":[47,5],"Ha Giang":[47,5]}};
function mapPage(title,key){const c=key==="thai"?"thailand":"vietnam",a=key==="thai"?data.thRoute:data.vnRoute;const pts=a.map((p,i)=>{let q=mapPos[c][p[0]]||[25+i*50/Math.max(1,a.length-1),10+(i%2)*25];return [q[0],q[1],i,p[0],p[1]]});const land=c==="thailand"?`<path class="map-land" d="M42 4 C37 7 34 12 34 17 C34 23 38 27 39 33 C40 39 37 44 41 49 C45 54 50 56 51 62 C52 67 48 72 45 77 C42 82 39 87 38 94 L46 98 C50 93 52 87 55 82 C58 76 59 70 56 64 C54 59 56 53 55 48 C54 42 49 38 49 32 C49 27 53 23 50 17 C48 12 48 7 45 4 Z"/>`:`<path class="map-land" d="M52 3 C47 7 46 12 49 17 C52 22 50 28 53 34 C56 39 55 45 58 51 C61 57 59 63 56 69 C53 75 54 81 50 87 C47 92 48 96 52 98 L61 98 C65 93 66 88 63 82 C61 77 63 71 65 65 C67 59 64 53 62 47 C60 41 62 35 59 29 C56 24 59 18 57 12 C56 7 55 4 52 3 Z"/>`;return `${back()}<section class="surface"><div class="pagehead"><div><div class="script" style="font-size:32px">${title}</div><h2>🗺️ Route Map</h2></div></div><p class="sub">Tap a number to see the destination and dates. Numbers follow your route order.</p><div class="map-wrap"><svg viewBox="0 0 100 100" role="img" aria-label="${title} route map"><rect width="100" height="100" fill="#fff"/>${land}${pts.map(([x,y,i])=>`<g class="map-marker" onclick="selectMapStop('${key}',${i})"><text x="${x}" y="${y}">${i+1}</text></g>`).join("")}</svg></div><div id="mapInfo" class="map-info"><h3>1. ${esc(a[0]?.[0]||"")}</h3><div class="date">${esc(a[0]?.[1]||"")}</div><div class="sub" style="margin-top:7px">${esc(a[0]?.[3]||"")}</div></div></section>`}
function selectMapStop(k,i){const a=k==="thai"?data.thRoute:data.vnRoute,p=a[i],e=document.getElementById("mapInfo");if(e)e.innerHTML=`<h3>${i+1}. ${esc(p[0])}</h3><div class="date">${esc(p[1])}</div><div class="sub" style="margin-top:7px">${esc(p[3])}</div>`}

let editState=null;
function iso(s,first){let m=String(s).match(/(\d{1,2})[–-](\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);if(m)return `${m[3]}-${month(m[4])}-${String(first?m[1]:m[2]).padStart(2,"0")}`;m=String(s).match(/(\d{1,2})\s+([A-Za-z]+)\s*[–-]\s*(\d{1,2})\s+([A-Za-z]+)(?:\s+(\d{4}))?/);if(m){let y=m[5]||"2027";return `${y}-${month(first?m[2]:m[4])}-${String(first?m[1]:m[3]).padStart(2,"0")}`}return ""}
function month(s){return String(new Date(Date.parse("1 "+s+" 2000")).getMonth()+1).padStart(2,"0")}
function nights(a,b){if(!a||!b)return"";let n=Math.round((new Date(b)-new Date(a))/86400000);return n>=0?n:""}
function editRoute(k,i){const a=k==="thai"?data.thRoute:data.vnRoute,p=a[i];editState={k,i,name:p[0],from:iso(p[1],true),to:iso(p[1],false),notes:p[3]};page="edit";render()}
function editPage(){let e=editState,n=nights(e.from,e.to);return `${back()}<section class="surface"><div class="script" style="font-size:32px">${e.k==="thai"?"Thailand":"Vietnam"}</div><h2>Edit stop ${e.i+1}</h2><div class="edit-card"><div class="edit-title">Change your stay</div><form onsubmit="saveEdit(event)"><label class="edit-label">Destination</label><input name="name" value="${esc(e.name)}" list="editPlaces" required autocomplete="off">${dl("editPlaces")}<div class="grid2"><div><label class="edit-label">From</label><input name="from" type="date" value="${e.from}" required></div><div><label class="edit-label">To</label><input name="to" type="date" value="${e.to}" required></div></div><div class="small muted">Nights: <b>${n||"—"}</b></div><label class="edit-label">Notes</label><textarea name="notes">${esc(e.notes)}</textarea><div class="action-row" style="justify-content:flex-start"><button type="button" class="btn" onclick="go('${e.k==="thai"?"thailand":"vietnam"}')">Cancel</button><button class="btn primary">Save changes</button></div></form></div></section>`}
function saveEdit(ev){ev.preventDefault();let f=new FormData(ev.target),a=editState.k==="thai"?data.thRoute:data.vnRoute,from=f.get("from"),to=f.get("to"),n=nights(from,to);if(n===""){alert("Please choose valid dates.");return}let fmt=x=>{let d=new Date(x+"T00:00:00");return `${d.getDate()} ${d.toLocaleString("en-AU",{month:"short"})} ${d.getFullYear()}`};a[editState.i]=[f.get("name"),`${fmt(from)}–${fmt(to)}`,`${n} ${n==1?"night":"nights"}`,f.get("notes")||""];save();let k=editState.k;editState=null;go(k==="thai"?"thailand":"vietnam")}
function budget(){let r={AUD:1,THB:23.58,VND:18458,USD:.712,GBP:.532},spent=data.spent.reduce((s,x)=>s+Number(x.amount),0),cur=data.displayCurrency||"AUD",money=n=>`${cur==="AUD"?"A$":cur==="GBP"?"£":cur==="USD"?"US$":cur==="THB"?"฿":"₫"}${(n*r[cur]).toLocaleString(undefined,{maximumFractionDigits:2})}`;return `${back()}<section class="surface"><h2>💰 Budget & Spending</h2><div class="card"><b>Trip budget: ${money(data.budget)}</b><div class="small muted">$14,000 AUD base budget</div><select onchange="data.displayCurrency=this.value;save();render()" style="margin-top:10px"><option value="AUD">AUD</option><option value="THB">THB</option><option value="VND">VND</option><option value="USD">USD</option><option value="GBP">GBP</option></select></div><div class="grid2"><div class="card"><div class="small muted">Spent</div><b>${money(spent)}</b></div><div class="card"><div class="small muted">Remaining</div><b>${money(data.budget-spent)}</b></div></div><div class="card"><h3>＋ Add spending</h3><form onsubmit="addSpend(event)"><div class="grid2"><input name="amount" type="number" step=".01" min="0" placeholder="Amount" required><select name="currency"><option>AUD</option><option>THB</option><option>VND</option><option>USD</option><option>GBP</option></select></div><select name="cat"><option>Food</option><option>Accommodation</option><option>Transport</option><option>Activities</option><option>Night out</option><option>Shopping</option><option>Other</option></select><button class="btn primary">Add spending</button></form></div></section>`}
function addSpend(e){e.preventDefault();let f=new FormData(e.target),r={AUD:1,THB:23.58,VND:18458,USD:.712,GBP:.532},c=f.get("currency"),o=Number(f.get("amount"));data.spent.push({amount:o/r[c],originalAmount:o,currency:c,cat:f.get("cat")});save();render()}
const checklist=["Passport","Travel insurance","Vietnam entry documents","Flight confirmations","Accommodation confirmations","Copies of important documents","Backup bank card","Emergency cash","Phone + charger","Power bank","Universal travel adaptor","eSIM / SIM plan","7–10 lightweight tops","4–5 lightweight bottoms","1 nicer outfit","Party outfit","2–3 swimwear","Light jumper","Light rain jacket","Underwear + socks","Sleepwear","Comfortable trainers","Sandals / flip flops","Small day backpack","Packing cubes","Microfibre towel","Reusable water bottle","Small dry bag","Toothbrush + toothpaste","SPF","Insect repellent","Basic medication","Period products","Sunglasses","Hat/cap","Laundry bag","Padlock"];
function checklistPage(){return `${back()}<section class="surface"><h2>🎒 3-Month Checklist</h2><p class="sub">Designed around a 20kg checked-bag limit. Completed items stay visible.</p>${checklist.map((x,i)=>`<label class="check"><input type="checkbox" ${data.checked.includes(i)?"checked":""} onchange="checkItem(${i},this.checked)"><span class="${data.checked.includes(i)?"done":""}">${esc(x)}</span></label>`).join("")}</section>`}
function travel(){return `${back()}<section class="surface"><h2>✈️ Travel</h2><div class="card"><form onsubmit="addTravel(event)"><input name="date" type="date" required><select name="mode"><option>Flight</option><option>Bus</option><option>Train</option><option>Ferry</option><option>Taxi / Transfer</option></select><div class="grid2"><input name="from" list="travelPlaces" placeholder="From" required><input name="to" list="travelPlaces" placeholder="To" required></div>${dl("travelPlaces")}<input name="details" placeholder="Booking reference / time / notes"><button class="btn primary">Save transport</button></form></div>${data.travel.map(x=>`<div class="route"><div class="small muted">${esc(x.date)} · ${esc(x.mode)}</div><div class="route-title">${esc(x.from)} → ${esc(x.to)}</div><div class="small muted">${esc(x.details||"")}</div></div>`).join("")}</section>`}
function addTravel(e){e.preventDefault();let f=new FormData(e.target);data.travel.push({date:f.get("date"),mode:f.get("mode"),from:f.get("from"),to:f.get("to"),details:f.get("details")});save();render()}
function checkItem(i,v){let s=new Set(data.checked);v?s.add(i):s.delete(i);data.checked=[...s];save();render()}
function addEvent(e,k){e.preventDefault();let f=new FormData(e.target);data[k==="thEvents"?"thEvents":"vnEvents"].push({title:f.get("title"),date:f.get("date"),location:f.get("location"),status:"WISHLIST",note:f.get("note")||""});save();render()}
function removeEvent(k,i){data[k==="thEvents"?"thEvents":"vnEvents"].splice(i,1);save();render()}
function moveRoute(k,i,d){let a=k==="thai"?data.thRoute:data.vnRoute,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
let page="home";
function go(p){page=p;render();scrollTo(0,0)}
function render(){app.innerHTML=page==="home"?home():page==="thailand"?routePage("Thailand","thai","Designed to move broadly in one direction: Bangkok → north → Gulf islands → west coast → Phuket."):page==="vietnam"?routePage("Vietnam","viet","South → north, with 1 January as a recovery day and the Ha Giang Loop as the final major adventure."):page==="thEvents"?eventPage("Thailand","thEvents"):page==="vnEvents"?eventPage("Vietnam","vnEvents"):page==="thMap"?mapPage("Thailand","thai"):page==="vnMap"?mapPage("Vietnam","viet"):page==="edit"?editPage():page==="budget"?budget():page==="checklist"?checklistPage():travel()}
render();
</script>
</body>
</html>
