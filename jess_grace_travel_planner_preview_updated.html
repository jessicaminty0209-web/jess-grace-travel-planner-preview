<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#819987">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Jess & Grace's Travel Planner</title>
<style>
:root{--sage:#819987;--sage2:#e8f0ea;--ink:#26352c;--muted:#68766e;--line:#d5dfd7;--cream:#faf9f5;--white:#fff;--pink:#d989a9;--pink2:#f8e7ee}
*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
.app{max-width:760px;margin:auto;padding:18px 14px 40px}.surface{background:var(--cream);border:1px solid var(--line);border-radius:24px;padding:22px}
.muted,.sub,.small{font-family:Inter,system-ui,sans-serif;color:var(--muted)}.small{font-size:12px}
h1{font-size:36px;line-height:1.08;margin:8px 0;color:var(--ink)}h2{font-size:28px;margin:8px 0}.script{font-family:"Brush Script MT","Segoe Script",cursive;font-weight:400}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.fund{text-align:right}.amount{font:750 27px Inter,system-ui,sans-serif}
.countbox{margin-top:22px;padding:20px;border-radius:18px;background:var(--sage2)}.count{font-size:40px;font-weight:700;margin-top:2px}
.menu{margin-top:22px;display:grid;gap:10px}.menu button{width:100%;display:flex;align-items:center;gap:15px;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:15px 17px;min-height:72px;color:var(--ink)}
.menu button:active{background:var(--sage2)}.icon{font:25px Inter,system-ui,sans-serif;width:34px;text-align:center}.menu-title{font-size:20px;font-weight:700}.arrow{margin-left:auto;font:24px Inter,system-ui,sans-serif}
button{cursor:pointer}.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:13px;padding:10px 13px;min-height:44px;font:14px Inter,system-ui,sans-serif}.primary{background:var(--sage);color:white;border-color:var(--sage)}.pink{background:var(--pink);color:white;border-color:var(--pink)}
.pagehead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.back{margin-bottom:14px}.action-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.route{border-left:3px solid var(--sage);padding:12px 0 12px 14px;margin-left:4px}.route-title{font-weight:700;font-size:17px}.tag{display:inline-block;background:var(--sage2);padding:4px 8px;border-radius:99px;font:11px Inter,system-ui,sans-serif;margin-top:5px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font:15px Inter,system-ui,sans-serif;min-height:44px}textarea{min-height:80px}
form{display:grid;gap:9px}.hidden{display:none!important}.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font:14px Inter,system-ui,sans-serif}.check input{width:20px;min-height:20px;margin-top:1px;accent-color:var(--sage)}.done{text-decoration:line-through;opacity:.55}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.danger{color:#9b5d5d}.empty{text-align:center;padding:20px;color:var(--muted);font:14px Inter,system-ui,sans-serif}
.route-actions{display:flex;gap:5px;flex-shrink:0}.mini{min-height:38px;padding:7px 9px;font-size:13px}
.map-wrap{margin-top:14px;background:#fff;border:0;border-radius:20px;padding:4px;overflow:hidden}.map-wrap svg{display:block;width:100%;height:auto;min-height:520px}
.map-land{fill:none;stroke:#222;stroke-width:.8;stroke-linejoin:round;stroke-linecap:round}.map-water{fill:#fff}
.map-marker{cursor:pointer}.map-marker text{fill:#111;font:800 3.2px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.map-marker.active text{fill:var(--pink)}
.map-info{margin-top:8px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px}.map-info h3{margin:0 0 5px;font-size:20px}.map-info .date{font:13px Inter,system-ui,sans-serif;color:var(--muted)}
.edit-card{margin-top:14px;background:var(--sage2);border:1px solid var(--line);border-radius:18px;padding:16px}.edit-title{font-size:20px;font-weight:700;margin-bottom:10px}.edit-label{font:12px Inter,system-ui,sans-serif;color:var(--muted);margin-bottom:4px;display:block}
.event-card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}.event-title{font-size:18px;font-weight:700}.event-meta{font:13px Inter,system-ui,sans-serif;color:var(--muted);margin-top:5px}
@media(max-width:560px){h1{font-size:31px}.grid2{grid-template-columns:1fr}.fund{text-align:left}.pagehead{align-items:flex-start;flex-direction:column}.action-row{justify-content:flex-start}.map-wrap svg{min-height:430px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const KEY="jg-travel-v1";
const thaiBase=[
["Bangkok","2–5 Nov 2026","3 nights","Grand Palace, Wat Pho, Chinatown, markets, rooftop evening."],
["Sukhothai","5–7 Nov","2 nights","Ancient temples and historical park."],
["Chiang Mai","7–13 Nov","6 nights","Old Town, Doi Suthep, markets, cooking class, elephant sanctuary."],
["Pai","13–17 Nov","4 nights","Pai Canyon, hot springs, waterfalls and mountain days."],
["Koh Tao","18–22 Nov","4 nights","Snorkelling/diving, viewpoints and beaches."],
["Koh Phangan","22–27 Nov","5 nights","Arrive before the 24 Nov Full Moon Party; beaches and recovery days."],
["Koh Samui","27–30 Nov","3 nights","Beach time, waterfalls and slower island days."],
["Khao Sok","30 Nov–3 Dec","3 nights","Jungle, Cheow Lan Lake and floating accommodation option."],
["Krabi","3–10 Dec","7 nights","Railay, Ao Nang, Hong Islands and island days."],
["Phi Phi","10–14 Dec","4 nights","Viewpoints, beaches and boat/snorkelling day."],
["Koh Lanta","14–19 Dec","5 nights","Slower island stop before Phuket."],
["Khao Lak","19–22 Dec","3 nights","Relaxed beach stop and progression toward Phuket."],
["Phuket","22 Dec–2 Jan","11 nights","Christmas, beaches, nightlife and New Year. Fly to Ho Chi Minh after Thailand."]
];
const vietBase=[
["Ho Chi Minh City","1–4 Jan 2027","3 nights","1 Jan is a rest day; explore from 2 Jan."],
["Mekong Delta","4–6 Jan","2 nights","Ben Tre / Can Tho, canals and floating-market experience."],
["Da Lat","6–8 Jan","2 nights","Highlands, waterfalls and cafés."],
["Hoi An","8–11 Jan","3 nights","Old Town, food, tailoring and beach."],
["Hue","11–13 Jan","2 nights","Imperial City and royal tombs."],
["Phong Nha","13–15 Jan","2 nights","Caves and national park."],
["Ninh Binh","15–18 Jan","3 nights","Trang An, Tam Coc and Mua Cave."],
["Hanoi","18–21 Jan","3 nights","Old Quarter, food and northern prep."],
["Ha Giang Loop","21–25 Jan","4 nights","MUST DO. Consider an Easy Rider if not experienced."],
["Hanoi","25–31 Jan","6 nights","Buffer, laundry, shopping and flight home."]
];
const base={budget:14000,spent:[],travel:[],checked:[],displayCurrency:"AUD",thRoute:structuredClone(thaiBase),vnRoute:structuredClone(vietBase),
thEvents:[
{title:"Full Moon Party — Koh Phangan",date:"24 Nov 2026",location:"Koh Phangan",status:"MUST DO",note:"Current published date; route is built around it."},
{title:"New Year Countdown — Phuket",date:"31 Dec 2026",location:"Phuket",status:"MUST DO",note:"Fixed around your Phuket stay."},
{title:"Yi Peng / Lantern Festival — Chiang Mai",date:"24–25 Nov 2026",location:"Chiang Mai",status:"WISHLIST",note:"Potential route conflict; verify dates before changing the itinerary."},
{title:"Full Moon Party — Koh Phangan",date:"24 Dec 2026",location:"Koh Phangan",status:"WISHLIST",note:"Conflicts with reaching Phuket around 22 Dec."}],
vnEvents:[
{title:"Ha Giang Loop",date:"Late Jan 2027",location:"Ha Giang",status:"MUST DO",note:"Final major adventure; allow about 4 days and keep weather flexibility."},
{title:"Hoi An Lantern Night",date:"TBC",location:"Hoi An",status:"WISHLIST",note:"Add the confirmed monthly date."},
{title:"Ha Long Bay / Lan Ha Bay",date:"TBC",location:"Ha Long Bay",status:"WISHLIST",note:"Optional northern highlight."}]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(base);
if(!Array.isArray(data.thRoute))data.thRoute=structuredClone(thaiBase);
if(!Array.isArray(data.vnRoute))data.vnRoute=structuredClone(vietBase);
if(!Array.isArray(data.thEvents))data.thEvents=[];
if(!Array.isArray(data.vnEvents))data.vnEvents=[];
const oldEvent=(e)=>Array.isArray(e)?{title:e[0]||"",date:e[1]||"TBC",location:eventLocationGuess(e[0]||""),status:e[2]||"WISHLIST",note:e[3]||""}:e;
data.thEvents=data.thEvents.map(oldEvent);data.vnEvents=data.vnEvents.map(oldEvent);
function eventLocationGuess(title){const t=String(title).toLowerCase();if(t.includes("phangan"))return"Koh Phangan";if(t.includes("phuket")||t.includes("new year"))return"Phuket";if(t.includes("yi peng")||t.includes("lantern"))return t.includes("hoi an")?"Hoi An":"Chiang Mai";if(t.includes("ha giang"))return"Ha Giang";if(t.includes("hoi an"))return"Hoi An";if(t.includes("ha long"))return"Ha Long Bay";return""}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
const placeSuggestions=[...new Set([...data.thRoute.map(x=>x[0]),...data.vnRoute.map(x=>x[0]),"Bangkok","Koh Phangan","Koh Tao","Koh Samui","Phuket","Chiang Mai","Pai","Krabi","Phi Phi","Koh Lanta","Khao Lak","Ho Chi Minh City","Mekong Delta","Da Lat","Hoi An","Hue","Phong Nha","Ninh Binh","Hanoi","Ha Giang","Ha Long Bay","Lan Ha Bay","Suvarnabhumi Airport","Don Mueang International Airport","Phuket International Airport","Tan Son Nhat International Airport","Noi Bai International Airport"])];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function datalist(id){return `<datalist id="${id}">${placeSuggestions.map(p=>`<option value="${esc(p)}"></option>`).join("")}</datalist>`}
function countdown(){const target=new Date("2026-11-02T00:00:00+10:00");return Math.max(0,Math.ceil((target-new Date())/86400000))}
function home(){return `<section class="surface"><div class="top"><div><div class="muted small">2 NOVEMBER 2026 — EARLY FEBRUARY 2027</div><h1>Jess & Grace's<br>Travel Planner</h1></div></div><div class="countbox"><div class="script" style="font-size:25px">Our adventure begins in...</div><div class="count">${countdown()} days</div><div class="muted small">until 2 November 2026 🇹🇭</div></div><div class="menu">${menu("🇹🇭","Thailand","Plan our route, destinations & things to do","thailand")}${menu("🇻🇳","Vietnam","Our route north & Ha Giang adventure","vietnam")}${menu("💰","Budget & Spending","Track our $14,000 AUD trip fund","budget")}${menu("🎒","Packing Checklist","Everything we need for 3 months","checklist")}${menu("✈️","Travel","Flights, buses, trains & ferries","travel")}</div></section>`}
function menu(icon,title,sub,p){return `<button onclick="go('${p}')"><span class="icon">${icon}</span><span><div class="menu-title">${title}</div><div class="menu-sub">${sub}</div></span><span class="arrow">›</span></button>`}
function back(){return `<button class="btn back" onclick="go('home')">← Home</button>`}
function routePage(title,key,desc){const arr=key==="thai"?data.thRoute:data.vnRoute;return `${back()}<section class="surface"><div class="pagehead"><div><div class="script" style="font-size:32px">${title}</div><h2>${title==="Thailand"?"🇹🇭":"🇻🇳"} Route</h2></div><div class="action-row"><button class="btn primary" onclick="go('${key==='thai'?'thEvents':'vnEvents'}')">✨ Events</button><button class="btn pink" onclick="go('${key==='thai'?'thMap':'vnMap'}')">🗺️ Map</button></div></div><p class="sub">${desc}</p><div>${arr.map((p,i)=>`<div class="route"><div class="row"><div style="flex:1"><div class="route-title">${i+1}. ${esc(p[0])}</div><div class="sub small">${esc(p[1])} · ${esc(p[2])}</div><div class="sub" style="margin-top:5px">${esc(p[3])}</div></div><div class="route-actions"><button class="btn mini" onclick="editRoute('${key}',${i})">Edit</button><button class="btn mini" onclick="moveRoute('${key}',${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn mini" onclick="moveRoute('${key}',${i},1)" ${i===arr.length-1?'disabled':''}>↓</button></div></div></div>`).join("")}</div></section>`}
function eventPage(title,key){const events=data[key==="thEvents"?"thEvents":"vnEvents"];return `${back()}<section class="surface"><div class="pagehead"><div><div class="script" style="font-size:32px">${title}</div><h2>✨ Events & must-dos</h2></div></div><p class="sub">Keep a running list of things you and your friend have talked about and definitely want to do or see.</p>${events.length?events.map((e,i)=>`<div class="event-card"><div class="row"><div style="flex:1"><div class="event-title">${esc(e.title)}</div><div class="event-meta">${esc(e.date)} · ${esc(e.location||"Location TBC")}</div>${e.note?`<div class="sub" style="margin-top:7px">${esc(e.note)}</div>`:""}</div><button class="btn danger" onclick="removeEvent('${key}',${i})">×</button></div><span class="tag">${esc(e.status||"WISHLIST")}</span></div>`).join(""): '<div class="empty">No events added yet.</div>'}<div class="card"><h3>＋ Add an event</h3><form onsubmit="addEvent(event,'${key}')"><input name="title" placeholder="Event title" required><input name="date" placeholder="Date" required><input name="location" list="places" placeholder="Where is it?" required autocomplete="off">${datalist("places")}<textarea name="note" placeholder="Optional notes"></textarea><button class="btn primary" type="submit">＋ Add event</button></form></div></section>`}

const mapPositions={
thailand:{
"Bangkok":[48,10],"Sukhothai":[43,19],"Chiang Mai":[38,14],"Pai":[35,10],
"Koh Tao":[57,55],"Koh Phangan":[61,60],"Koh Samui":[64,59],"Khao Sok":[52,55],
"Krabi":[48,66],"Phi Phi":[44,72],"Koh Lanta":[42,78],"Khao Lak":[45,57],"Phuket":[43,70]
},
vietnam:{
"Ho Chi Minh City":[49,86],"Mekong Delta":[45,94],"Da Lat":[51,76],"Hoi An":[60,58],
"Hue":[59,48],"Phong Nha":[56,38],"Ninh Binh":[55,20],"Hanoi":[53,12],"Ha Giang Loop":[47,5],"Ha Giang":[47,5]
}};
function norm(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ")}
function markerPoint(country,name,index,total){
 const positions=mapPositions[country], exact=positions[name];
 if(exact){
   const arr=data[country==='thailand'?'thRoute':'vnRoute'];
   const sameBefore=arr.slice(0,index).filter(p=>norm(p[0])===norm(name)).length;
   return [exact[0]+sameBefore*2.2,exact[1]+sameBefore*1.6];
 }
 return [25+(index/Math.max(1,total-1))*50,10+(index%2)*25];
}
function mapPage(title,key){
 const country=key==='thai'?'thailand':'vietnam',arr=key==='thai'?data.thRoute:data.vnRoute;
 const selected=arr[0]?.[0]||"";
 const pts=arr.map((p,i)=>[...markerPoint(country,p[0],i,arr.length),i,p[0],p[1]]);
 /* Minimal line-art outlines, intentionally unfilled like the reference screenshots. */
 const land=country==='thailand'
 ?`<path class="map-land" d="M42 4 C37 7 34 12 34 17 C34 23 38 27 39 33 C40 39 37 44 41 49 C45 54 50 56 51 62 C52 67 48 72 45 77 C42 82 39 87 38 94 L46 98 C50 93 52 87 55 82 C58 76 59 70 56 64 C54 59 56 53 55 48 C54 42 49 38 49 32 C49 27 53 23 50 17 C48 12 48 7 45 4 Z"/>`
 :`<path class="map-land" d="M52 3 C47 7 46 12 49 17 C52 22 50 28 53 34 C56 39 55 45 58 51 C61 57 59 63 56 69 C53 75 54 81 50 87 C47 92 48 96 52 98 L61 98 C65 93 66 88 63 82 C61 77 63 71 65 65 C67 59 64 53 62 47 C60 41 62 35 59 29 C56 24 59 18 57 12 C56 7 55 4 52 3 Z"/>`;
 return `${back()}<section class="surface"><div class="pagehead"><div><div class="script" style="font-size:32px">${title}</div><h2>🗺️ Route Map</h2></div></div><p class="sub">Tap a number to see the destination and dates. The numbers automatically follow the order of your route.</p><div class="map-wrap"><svg viewBox="0 0 100 100" role="img" aria-label="${title} route map"><rect class="map-water" x="0" y="0" width="100" height="100"></rect>${land}${pts.map(([x,y,i,name,date])=>`<g class="map-marker" onclick="selectMapStop('${key}',${i})"><text x="${x}" y="${y}">${i+1}</text></g>`).join("")}</svg></div><div id="mapInfo" class="map-info"><h3>1. ${esc(selected)}</h3><div class="date">${esc(arr[0]?.[1]||"")}</div><div class="sub" style="margin-top:7px">${esc(arr[0]?.[3]||"")}</div></div></section>`;
}
function selectMapStop(key,i){
 const arr=key==='thai'?data.thRoute:data.vnRoute,p=arr[i],el=document.getElementById('mapInfo');
 if(el&&p)el.innerHTML=`<h3>${i+1}. ${esc(p[0])}</h3><div class="date">${esc(p[1])}</div><div class="sub" style="margin-top:7px">${esc(p[3])}</div>`;
}
function editRoute(key,i){
 const arr=key==='thai'?data.thRoute:data.vnRoute,p=arr[i];
 const oldFrom=toISODate(p[1],key==='thai'?'2026':'2027',true),oldTo=toISODate(p[1],key==='thai'?'2026':'2027',false);
 page='editRoute';
 editState={key,i,name:p[0],from:oldFrom,to:oldTo,notes:p[3]};
 render();
}
let editState=null;
function toISODate(range,defaultYear,first){
 const s=String(range||"").trim();
 let m=s.match(/(\d{1,2})[–-](\d{1,2})\s+([A-Za-z]+)\s+(\d{4})/);
 if(m){return `${m[3]}-${String(monthNum(m[4])).padStart(2,'0')}-${String(first?m[1]:m[2]).padStart(2,'0')}`}
 m=s.match(/(\d{1,2})\s+([A-Za-z]+)\s*[–-]\s*(\d{1,2})\s+([A-Za-z]+)(?:\s+(\d{4}))?/);
 if(m){const y=Number(m[5]||defaultYear),m1=monthNum(m[2]),m2=monthNum(m[4]),y2=m2<m1?y+1:y;return `${y2}-${String(first?m1:m2).padStart(2,'0')}-${String(first?m[1]:m[3]).padStart(2,'0')}`}
 m=s.match(/(\d{1,2})\s+([A-Za-z]+)(?:\s+(\d{4}))?/);
 if(m){return `${m[3]||defaultYear}-${String(monthNum(m[2])).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`}
 return '';
}
function nightsBetween(from,to){
 if(!from||!to)return "";
 const a=new Date(from+"T00:00:00"),b=new Date(to+"T00:00:00"),n=Math.round((b-a)/86400000);
 return n>=0?n:"";
}
function editPage(){
 const e=editState;
 if(!e)return go('home');
 const nights=nightsBetween(e.from,e.to);
 return `${back()}<section class="surface"><div class="script" style="font-size:32px">${e.key==='thai'?'Thailand':'Vietnam'}</div><h2>Edit stop ${e.i+1}</h2><div class="edit-card"><div class="edit-title">Change your stay</div><form onsubmit="saveRouteEdit(event)"><div><label class="edit-label">Destination</label><input name="name" value="${esc(e.name)}" list="editPlaces" required autocomplete="off">${datalist('editPlaces')}</div><div class="grid2"><div><label class="edit-label">From</label><input name="from" type="date" value="${esc(e.from)}" required></div><div><label class="edit-label">To</label><input name="to" type="date" value="${esc(e.to)}" required></div></div><div class="small muted">Nights: <b id="editNights">${nights||'—'}</b></div><div><label class="edit-label">Notes</label><textarea name="notes" placeholder="What do you want to remember?">${esc(e.notes)}</textarea></div><div class="action-row" style="justify-content:flex-start"><button type="button" class="btn" onclick="go('${e.key==='thai'?'thailand':'vietnam'}')">Cancel</button><button class="btn primary" type="submit">Save changes</button></div></form></div></section>`;
}
function saveRouteEdit(ev){
 ev.preventDefault();
 const targetPage=editState.key==='thai'?'thailand':'vietnam';
 const f=new FormData(ev.target),arr=editState.key==='thai'?data.thRoute:data.vnRoute;
 const name=f.get('name'),from=f.get('from'),to=f.get('to'),notes=f.get('notes')||"";
 const nights=nightsBetween(from,to);
 if(!nights||Number(nights)<0){alert('Please choose a valid From and To date.');return}
 const a=new Date(from+"T00:00:00"),b=new Date(to+"T00:00:00");
 const fmt=d=>`${d.getDate()} ${d.toLocaleString('en-AU',{month:'short'})} ${d.getFullYear()}`;
 arr[editState.i]=[name,`${fmt(a)}–${fmt(b)}`,`${nights} ${Number(nights)===1?'night':'nights'}`,notes];
 save();editState=null;page=targetPage;render();
}
function budget(){const rates={AUD:1,THB:23.58,VND:18458,USD:.712,GBP:.532},spent=data.spent.reduce((a,x)=>a+Number(x.amount||0),0),remain=data.budget-spent,display=data.displayCurrency||"AUD",fmt=(n,c=display)=>{const v=n*(rates[c]||1);return `${c==='AUD'?'A$':c==='GBP'?'£':c==='USD'?'US$':c==='THB'?'฿':'₫'}${v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`};return `${back()}<section class="surface"><div class="pagehead"><div><div class="script" style="font-size:32px">Money</div><h2>Budget & Spending</h2></div><div class="fund"><div class="muted small">TRIP BUDGET</div><div class="amount">${fmt(data.budget)}</div><div class="small muted">$14,000 AUD base budget</div></div></div><div class="card" style="margin-bottom:14px"><div class="small muted" style="margin-bottom:5px">Show budget totals in</div><select onchange="setDisplayCurrency(this.value)"><option value="AUD" ${display==='AUD'?'selected':''}>AUD — Australian Dollar</option><option value="THB" ${display==='THB'?'selected':''}>THB — Thai Baht</option><option value="VND" ${display==='VND'?'selected':''}>VND — Vietnamese Dong</option><option value="USD" ${display==='USD'?'selected':''}>USD — US Dollar</option><option value="GBP" ${display==='GBP'?'selected':''}>GBP — British Pound</option></select><div class="small muted" style="margin-top:6px">Change this to view your $14,000 AUD budget, spent amount and remaining amount in another currency.</div></div><div class="grid2"><div class="card"><div class="small muted">Spent</div><b style="font:700 24px Inter">${fmt(spent)}</b></div><div class="card"><div class="small muted">Remaining</div><b style="font:700 24px Inter">${fmt(remain)}</b></div></div><div class="card"><h3>Currency Converter</h3><form oninput="convert()"><div class="grid2"><div><div class="small muted" style="margin-bottom:5px">Amount</div><input id="convAmt" type="number" value="100" min="0" step=".01"></div><div><div class="small muted" style="margin-bottom:5px">From</div><select id="convFrom"><option value="AUD">AUD — Australian Dollar</option><option value="THB">THB — Thai Baht</option><option value="VND">VND — Vietnamese Dong</option><option value="USD">USD — US Dollar</option><option value="GBP">GBP — British Pound</option></select></div></div><div class="grid2" style="margin-top:10px"><div><div class="small muted" style="margin-bottom:5px">Convert to</div><select id="convTo"><option value="THB">THB — Thai Baht</option><option value="AUD">AUD — Australian Dollar</option><option value="VND">VND — Vietnamese Dong</option><option value="USD">USD — US Dollar</option><option value="GBP">GBP — British Pound</option></select></div><div></div></div><div id="conversion" class="countbox">≈ 2,358 THB</div></form><div class="small muted">Rates are indicative. You can change both currencies whenever you want.</div></div><div class="card"><h3>＋ Add spending</h3><form onsubmit="addSpend(event)"><div class="grid2"><div><div class="small muted" style="margin-bottom:5px">Amount & currency</div><div class="grid2"><input name="amount" type="number" min="0" step=".01" placeholder="Amount" required><select name="currency"><option value="AUD">AUD</option><option value="THB">THB</option><option value="VND">VND</option><option value="USD">USD</option><option value="GBP">GBP</option></select></div></div><div><div class="small muted" style="margin-bottom:5px">Category</div><select name="cat"><option>Food</option><option>Accommodation</option><option>Transport</option><option>Activities</option><option>Night out</option><option>Shopping</option><option>Other</option></select></div></div><div class="small muted" style="margin-top:10px">Enter the amount in the currency you actually paid. It is automatically converted to AUD and deducted from your $14,000 AUD trip budget.</div><button class="btn primary">Add spending</button></form>${data.spent.map(x=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span><b>${esc(x.cat)}</b><span class="small"> · ${esc(x.currency||'AUD')} ${Number(x.originalAmount??x.amount).toLocaleString(undefined,{maximumFractionDigits:2})}</span><div class="small muted">− A$${Number(x.amount).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})} from trip budget</div></span></div>`).join('')}</div></section>`}
const checklist=[
["Documents","Passport","Valid for the trip"],["Documents","Travel insurance","Policy + emergency contact"],["Documents","Vietnam entry documents","Check requirements before departure"],["Documents","Flight confirmations","Save offline"],["Documents","Accommodation confirmations","Save offline"],["Documents","Copies of important documents","Cloud + phone copy"],["Money","Backup bank card","Keep separate"],["Money","Emergency cash","Small reserve"],["Tech","Phone + charger",""],["Tech","Power bank",""],["Tech","Universal travel adaptor",""],["Tech","eSIM / SIM plan",""],["Clothing","7–10 lightweight tops","Laundry during trip"],["Clothing","4–5 lightweight bottoms",""],["Clothing","1 nicer outfit","Dinner/night out"],["Clothing","Party outfit","Full Moon / nightlife"],["Clothing","2–3 swimwear",""],["Clothing","Light jumper","Northern Vietnam / cool evenings"],["Clothing","Light rain jacket",""],["Clothing","Underwear + socks","Approx. 7–10 days"],["Clothing","Sleepwear","Lightweight"],["Footwear","Comfortable trainers",""],["Footwear","Sandals / flip flops",""],["Travel gear","Small day backpack",""],["Travel gear","Packing cubes",""],["Travel gear","Microfibre towel",""],["Travel gear","Reusable water bottle",""],["Travel gear","Small dry bag","Islands/boats"],["Toiletries","Toothbrush + toothpaste","Travel size"],["Toiletries","SPF",""],["Toiletries","Insect repellent",""],["Toiletries","Basic medication",""],["Toiletries","Period products",""],["Other","Sunglasses",""],["Other","Hat/cap",""],["Other","Laundry bag",""],["Other","Padlock",""]];
function checklistPage(){return `${back()}<section class="surface"><div class="pagehead"><div><div class="script" style="font-size:32px">Pack light</div><h2>3-Month Checklist</h2></div><b>${data.checked.length}/${checklist.length}</b></div><p class="sub">Designed around a 20kg checked-bag limit. Completed items stay visible and are crossed out.</p>${checklist.map((x,i)=>`<label class="check"><input type="checkbox" ${data.checked.includes(i)?'checked':''} onchange="checkItem(${i},this.checked)"><span class="${data.checked.includes(i)?'done':''}"><b>${esc(x[0])}</b> · ${esc(x[1])}${x[2]?`<div class="small">${esc(x[2])}</div>`:''}</span></label>`).join('')}</section>`}
function travel(){let list=[...data.travel].sort((a,b)=>a.date.localeCompare(b.date));return `${back()}<section class="surface"><div class="pagehead"><div><div class="script" style="font-size:32px">Getting around</div><h2>Travel</h2></div><button class="btn primary" onclick="toggle('travelForm')">＋</button></div><p class="sub">Flights, buses, trains and ferries are automatically sorted chronologically.</p>${list.length?list.map(x=>`<div class="route"><div class="small muted">${esc(x.date)} · ${esc(x.mode)}</div><div class="route-title">${esc(x.from)} → ${esc(x.to)}</div><div class="small muted">${esc(x.details||'')}</div></div>`).join(''):'<div class="empty">No transport added yet.</div>'}<div id="travelForm" class="hidden card"><form onsubmit="addTravel(event)"><input name="date" type="date" required><select name="mode"><option>Flight</option><option>Bus</option><option>Train</option><option>Ferry</option><option>Taxi / Transfer</option></select><div class="grid2"><div><input name="from" list="travelPlaces" placeholder="From" required autocomplete="off"></div><div><input name="to" list="travelPlaces" placeholder="To" required autocomplete="off"></div></div>${datalist('travelPlaces')}<input name="details" placeholder="Booking reference / time / notes"><button class="btn primary">Save transport</button></form></div></section>`}
let page="home";
function go(p){page=p;render();scrollTo(0,0)}
function toggle(id){document.getElementById(id)?.classList.toggle('hidden')}
function moveRoute(key,i,dir){const arr=key==='thai'?data.thRoute:data.vnRoute,j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();render()}
function removeEvent(key,i){data[key==='thEvents'?'thEvents':'vnEvents'].splice(i,1);save();render()}
function addEvent(e,key){e.preventDefault();const f=new FormData(e.target);data[key==='thEvents'?'thEvents':'vnEvents'].push({title:f.get('title'),date:f.get('date'),location:f.get('location'),status:'WISHLIST',note:f.get('note')||''});save();render()}
function setDisplayCurrency(currency){data.displayCurrency=currency;save();render()}
function addSpend(e){e.preventDefault();const f=new FormData(e.target),rates={AUD:1,THB:23.58,VND:18458,USD:.712,GBP:.532},currency=f.get('currency')||'AUD',originalAmount=Number(f.get('amount'));data.spent.push({amount:originalAmount/(rates[currency]||1),originalAmount,currency,cat:f.get('cat')});save();render()}
function convert(){const a=Number(document.getElementById('convAmt')?.value||0),from=document.getElementById('convFrom')?.value||'AUD',to=document.getElementById('convTo')?.value||'THB',r={AUD:1,THB:23.58,VND:18458,USD:.712,GBP:.532},result=a*(r[to]/r[from]),el=document.getElementById('conversion');if(el)el.textContent=`≈ ${result.toLocaleString(undefined,{maximumFractionDigits:2})} ${to}`}
function checkItem(i,v){const s=new Set(data.checked);v?s.add(i):s.delete(i);data.checked=[...s];save();render()}
function addTravel(e){e.preventDefault();const f=new FormData(e.target);data.travel.push({date:f.get('date'),mode:f.get('mode'),from:f.get('from'),to:f.get('to'),details:f.get('details')});save();render()}
function render(){document.getElementById('app').innerHTML=page==='home'?home():page==='thailand'?routePage('Thailand','thai','Designed to move broadly in one direction: Bangkok → north → Gulf islands → west coast → Phuket.'):page==='vietnam'?routePage('Vietnam','viet','South → north, with 1 January as a recovery day and the Ha Giang Loop as the final major adventure.'):page==='thEvents'?eventPage('Thailand','thEvents'):page==='vnEvents'?eventPage('Vietnam','vnEvents'):page==='thMap'?mapPage('Thailand','thai'):page==='vnMap'?mapPage('Vietnam','viet'):page==='editRoute'?editPage():page==='budget'?budget():page==='checklist'?checklistPage():travel()}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
render();setInterval(()=>{if(page==='home'){const el=document.querySelector('.count');if(el)el.textContent=countdown()+' days'}},60000);
</script>
